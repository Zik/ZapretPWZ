name: Update alive_hosts

on:
  schedule:
    - cron: "0 3 * * *"   # каждый день в 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-alive-hosts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download list
        run: |
          set -euo pipefail
          URL="https://schakal.ru/hosts/alive_hosts.txt"
          OUT="AdGuardHome/alive_hosts.txt"

          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
            -A "Mozilla/5.0 (GitHub Actions)" \
            "$URL" -o "${OUT}.new"

          test -s "${OUT}.new"
          grep -Eq '\S' "${OUT}.new"

          mv "${OUT}.new" "$OUT"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add AdGuardHome/alive_hosts.txt
          git commit -m "Update alive_hosts.txt"
          git push
